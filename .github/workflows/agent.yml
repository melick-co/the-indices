name: insight-agent

on:
  schedule:
    - cron: '0 21 * * *'
    - cron: '0 9 * * *'
    - cron: '15 21 * * *'
    - cron: '15 9 * * *'
    - cron: '30 21 * * *'
    - cron: '30 9 * * *'
    - cron: '30 20 * * *'
    - cron: '0 2 * * *'
    - cron: '0 14 * * *'
    - cron: '0 22 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Which task to run'
        type: choice
        options: [rss, trends, trending, trending-review, email, daily, sources, oecd, articles, articles-dry-run, articles-draft, media-smoke, media-smoke-video, hero-media, story-refresh, story-refresh-apply, story-revision-show, story-revision-edit, story-revision-recheck, scout, scout-dry-run, refresh, metric-links, metric-links-apply, both]
        default: both
      pitch:
        description: 'articles: pitch id(s) to rerun; scout: metric id(s) to look for; hero-media, story-refresh(-apply): story slug(s). Space separated.'
        required: false
        default: ''
      edits:
        description: 'story-revision-edit: JSON list of {"find": "...", "replace": "..."} copy edits.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: insight-agent
  cancel-in-progress: false

jobs:
  rss:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'rss' || inputs.task == 'both') ||
      github.event_name == 'schedule' &&
      (github.event.schedule == '0 21 * * *' || github.event.schedule == '0 9 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: agent }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install @supabase/supabase-js --no-save --silent
      - name: RSS sweep
        run: node scripts/run-rss.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}

  trends:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'trends' || inputs.task == 'both') ||
      github.event_name == 'schedule' &&
      (github.event.schedule == '15 21 * * *' || github.event.schedule == '15 9 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: agent }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install @supabase/supabase-js --no-save --silent
      - name: Feed trend hypotheses
        run: node scripts/run-trends.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  trending-topics:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'trending' || inputs.task == 'trending-review' || inputs.task == 'both') ||
      github.event_name == 'schedule' && github.event.schedule == '0 14 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run: { working-directory: agent }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install @supabase/supabase-js --no-save --silent
      - name: Daily trending topics (RSS + X)
        if: github.event_name != 'workflow_dispatch' || inputs.task != 'trending-review'
        run: node scripts/run-trending-topics.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
      - name: Review trending topics against Foundry pitches
        run: node scripts/run-trending-review.mjs --json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}

  email:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'email' || inputs.task == 'both') ||
      github.event_name == 'schedule' &&
      (github.event.schedule == '30 21 * * *' || github.event.schedule == '30 9 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: agent }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install @supabase/supabase-js --no-save --silent
      - name: Editorial email review
        run: node scripts/run-email-review.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  daily:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'daily' || inputs.task == 'both') ||
      github.event_name == 'schedule' && github.event.schedule == '30 20 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: { working-directory: agent }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install @supabase/supabase-js --no-save --silent
      - name: Daily pitch run
        run: node scripts/run-daily.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}

  refresh:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.task == 'refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: { working-directory: agent }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install @supabase/supabase-js --no-save --silent
      - name: Hot refresh + revise pitches
        run: node scripts/refresh-and-revise.mjs --json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  metric-links:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'metric-links' || inputs.task == 'metric-links-apply')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: agent }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install @supabase/supabase-js --no-save --silent
      - name: Repair pitch metric links
        run: node scripts/fix-metric-links.mjs ${{ inputs.task == 'metric-links-apply' && '--apply' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  oecd:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'oecd'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: { working-directory: agent }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install @supabase/supabase-js --no-save --silent
      - name: OECD only
        run: node scripts/load-sources.mjs oecd
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  articles:
    # Daily auto-articles from all-5 pitches (web/scripts/auto-articles.ts).
    # 22:00 UTC is 8am Sydney, after the morning daily taste run.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'articles' || inputs.task == 'articles-dry-run' || inputs.task == 'articles-draft') ||
      github.event_name == 'schedule' && github.event.schedule == '0 22 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --silent
      - run: npm install @supabase/supabase-js --no-save --silent
        working-directory: agent
      - name: Ensure ffmpeg (hero video muxing)
        # Never block the articles: without ffmpeg, media is published unencoded and unnarrated.
        continue-on-error: true
        timeout-minutes: 4
        run: |
          # Static ffmpeg from npm (downloads from GitHub releases); apt on the runners is unreliable.
          npm install --no-save --silent ffmpeg-static@5.3.0
          echo "FFMPEG_PATH=$(node -p "require('ffmpeg-static')")" >> "$GITHUB_ENV"
      - name: Write and publish articles
        run: npx tsx --import ./scripts/node-shims.mjs scripts/auto-articles.ts ${{ inputs.task == 'articles-dry-run' && '--dry-run' || inputs.task == 'articles-draft' && '--no-publish' || '' }}
        env:
          AUTO_ARTICLE_PITCHES: ${{ inputs.pitch }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

  story-refresh:
    # Rewrite published articles in the house news style (web/scripts/refresh-stories.ts; pitch input = slugs).
    # story-refresh saves pending revisions to preview at /stories/<slug>?revision=1; story-refresh-apply puts
    # revisions that passed their checks live, archiving the replaced version.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'story-refresh' || inputs.task == 'story-refresh-apply' || startsWith(inputs.task, 'story-revision-'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --silent
      - run: npm install @supabase/supabase-js --no-save --silent
        working-directory: agent
      - name: Refresh stories
        run: >-
          npx tsx --import ./scripts/node-shims.mjs scripts/refresh-stories.ts
          ${{ inputs.task == 'story-refresh-apply' && '--apply' || inputs.task == 'story-revision-show' && '--show'
          || inputs.task == 'story-revision-edit' && '--edit' || inputs.task == 'story-revision-recheck' && '--recheck' || '' }}
        env:
          STORY_SLUGS: ${{ inputs.pitch }}
          REVISION_EDITS: ${{ inputs.edits }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  scout:
    # Daily source scout (agent/scripts/scout-sources.mjs): adopt official series that
    # research suggested or pitches keep asking for, load them, re-link pitches. 03:00 UTC.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'scout' || inputs.task == 'scout-dry-run') ||
      github.event_name == 'schedule' && github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run: { working-directory: agent }
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install @supabase/supabase-js --no-save --silent
      - name: Scout sources
        run: node scripts/scout-sources.mjs ${{ inputs.task == 'scout-dry-run' && '--dry-run' || '' }}
        env:
          SCOUT_IDS: ${{ inputs.pitch }}
      - name: Load adopted series
        if: inputs.task != 'scout-dry-run'
        run: |
          node scripts/load-sources.mjs abs
          node scripts/load-sources.mjs oecd
          node scripts/load-sources.mjs rba
          node scripts/load-sources.mjs extra
          node scripts/watch-wb.mjs load
      - name: Re-link pitches
        if: inputs.task != 'scout-dry-run'
        run: node scripts/fix-metric-links.mjs --apply

  media-smoke:
    # One small image and a voice line (optionally a 4s video) to confirm the ElevenLabs setup;
    # hero-media generates hero art and the narrated clip for one story (pitch input = slug).
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'media-smoke' || inputs.task == 'media-smoke-video' || inputs.task == 'hero-media')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --silent
      - name: ElevenLabs smoke test
        if: inputs.task != 'hero-media'
        run: npx tsx --import ./scripts/node-shims.mjs scripts/elevenlabs-smoke.ts ${{ inputs.task == 'media-smoke-video' && '--video' || '' }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      - name: Ensure ffmpeg
        if: inputs.task == 'hero-media'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          # Static ffmpeg from npm (downloads from GitHub releases); apt on the runners is unreliable.
          npm install --no-save --silent ffmpeg-static@5.3.0
          echo "FFMPEG_PATH=$(node -p "require('ffmpeg-static')")" >> "$GITHUB_ENV"
      - name: Hero image and video for one story (pitch input = story slug)
        if: inputs.task == 'hero-media'
        run: npx tsx --import ./scripts/node-shims.mjs scripts/hero-media.ts --video
        env:
          HERO_SLUG: ${{ inputs.pitch }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  sources:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'sources' || inputs.task == 'both') ||
      github.event_name == 'schedule' && github.event.schedule == '0 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run: { working-directory: agent }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install @supabase/supabase-js --no-save --silent
      - name: Source connectors (ABS + World Bank + RBA)
        run: node scripts/load-sources.mjs all --revise
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
