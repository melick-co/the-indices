name: insight-agent

on:
  schedule:
    # Times are UTC. Sydney is UTC+10 (AEST) / UTC+11 (AEDT).
    # RSS sweep: 07:00 and 19:00 Sydney (AEST) = 21:00 and 09:00 UTC
    - cron: '0 21 * * *'
    - cron: '0 9 * * *'
    # Daily pitch run: 06:30 Sydney (AEST) = 20:30 UTC previous day
    - cron: '30 20 * * *'
  # Manual trigger from the Actions tab, with a choice of job
  workflow_dispatch:
    inputs:
      task:
        description: 'Which task to run'
        type: choice
        options: [rss, daily, both]
        default: both

permissions:
  contents: read

concurrency:
  group: insight-agent
  cancel-in-progress: false

jobs:
  rss:
    # run on the two RSS crons, or when manually asked for rss/both
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'rss' || inputs.task == 'both') ||
      github.event_name == 'schedule' &&
      (github.event.schedule == '0 21 * * *' || github.event.schedule == '0 9 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: agent }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install @supabase/supabase-js --no-save --silent
      - name: RSS sweep
        run: node scripts/run-rss.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}

  daily:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'daily' || inputs.task == 'both') ||
      github.event_name == 'schedule' && github.event.schedule == '30 20 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: { working-directory: agent }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install @supabase/supabase-js --no-save --silent
      - name: Daily pitch run
        run: node scripts/run-daily.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
