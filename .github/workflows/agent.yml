name: insight-agent
# Shown as each run's title (Foundry's Make tab lists them): the task and its input, or the schedule.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('{0} {1}', inputs.task, inputs.pitch) || format('scheduled {0}', github.event.schedule) }}

on:
  schedule:
    - cron: '0 21 * * *'
    - cron: '0 9 * * *'
    - cron: '15 21 * * *'
    - cron: '15 9 * * *'
    - cron: '30 21 * * *'
    - cron: '30 9 * * *'
    - cron: '37 13 * * *'
    - cron: '7 2 * * *'
    - cron: '7 11 * * *'
    - cron: '7 16 * * *'
    # Scheduled runs often start hours late (worst seen: 6.5h), so the article chain runs from mid-afternoon UTC
    # (sources 02:07, scout 03:07, trending 11:07, daily 13:37, articles 16:07 = 3am Sydney) and lands before
    # breakfast even when delayed. Odd minutes avoid the top-of-hour queue.
    - cron: '7 3 * * *'
    # Events: build the watch list after the nightly document load, and a weekday fallback for the watcher
    # (Supabase dispatches it at each event's exact time once its GitHub token is set; see 34_events.sql).
    - cron: '23 2 * * *'
    - cron: '41 0-8 * * 1-5'
    # Visuals for The Indices: one a day at about 8am Sydney (web/scripts/generate-visuals.ts, daily cap in the script).
    - cron: '19 21 * * *'
    # Bar-chart-race videos for The Indices: weekly, Tuesday about 9am Sydney (web/scripts/render-races.ts).
    - cron: '43 22 * * 1'
    # Production queue: the scheduling assistant slots anything ready (generators also run it after queuing). Sites
    # publish at the slot from Supabase (pg_cron, 42_production_queue.sql), not from here.
    - cron: '11 19 * * *'
    - cron: '11 1 * * *'
    - cron: '11 7 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Which task to run'
        type: choice
        options: [rss, trends, trending, trending-review, email, daily, sources, oecd, polls, polls-dry-run, population, population-dry-run, pnl, pnl-dry-run, wb, visuals, visuals-dry-run, visuals-list, races, races-dry-run, races-list, schedule, schedule-list, schedule-reupload-youtube, articles, articles-dry-run, articles-draft, media-smoke, media-smoke-video, hero-media, hero-brief, hero-review, story-highlights, story-highlights-dry-run, reel-cut, story-refresh, story-refresh-apply, story-revision-show, story-revision-edit, story-revision-recheck, story-revision-discard, story-figures, story-charts, story-audit, story-rename, story-notes, story-restore-notes, dashboard-check, story-drafts, story-publish, events-calendar, events-backfill, events-history, events-watch, events-list, events-cpi, story-sources, documents, hero-image, scout, scout-dry-run, refresh, metric-links, metric-links-apply, both]
        default: both
      pitch:
        description: 'articles: pitch id(s) to rerun; scout: metric id(s) to look for; hero-media, reel-cut, story-refresh(-apply): story slug(s). Space separated.'
        required: false
        default: ''
      edits:
        description: 'story-revision-edit: JSON list of {"find": "...", "replace": "..."} copy edits. hero-image, hero-media: a set art brief (the scene to draw) in place of the model''s.'
        required: false
        default: ''
      note:
        description: 'story-refresh-apply: reader-facing update note (default: the news-format refresh note).'
        required: false
        default: ''
      brief:
        description: "story-refresh: the editor's brief for the rewrite (e.g. a correction that reverses the finding)."
        required: false
        default: ''
      metrics:
        description: 'story-revision-edit: metric ids the revised copy quotes, added to what the re-check audits against.'
        required: false
        default: ''
      drop:
        description: 'story-revision-edit on a draft: block positions to remove (as story-revision-show numbers them).'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: insight-agent
  cancel-in-progress: false

jobs:
  rss:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'rss' || inputs.task == 'both') ||
      github.event_name == 'schedule' &&
      (github.event.schedule == '0 21 * * *' || github.event.schedule == '0 9 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: agent }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install @supabase/supabase-js --no-save --silent
      - name: RSS sweep
        run: node scripts/run-rss.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}

  trends:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'trends' || inputs.task == 'both') ||
      github.event_name == 'schedule' &&
      (github.event.schedule == '15 21 * * *' || github.event.schedule == '15 9 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: agent }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install @supabase/supabase-js --no-save --silent
      - name: Feed trend hypotheses
        run: node scripts/run-trends.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  trending-topics:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'trending' || inputs.task == 'trending-review' || inputs.task == 'both') ||
      github.event_name == 'schedule' && github.event.schedule == '7 11 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run: { working-directory: agent }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install @supabase/supabase-js --no-save --silent
      - name: Daily trending topics (RSS + X)
        if: github.event_name != 'workflow_dispatch' || inputs.task != 'trending-review'
        run: node scripts/run-trending-topics.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
      - name: Review trending topics against Foundry pitches
        run: node scripts/run-trending-review.mjs --json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}

  email:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'email' || inputs.task == 'both') ||
      github.event_name == 'schedule' &&
      (github.event.schedule == '30 21 * * *' || github.event.schedule == '30 9 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: agent }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install @supabase/supabase-js --no-save --silent
      - name: Editorial email review
        run: node scripts/run-email-review.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  daily:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'daily' || inputs.task == 'both') ||
      github.event_name == 'schedule' && github.event.schedule == '37 13 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: { working-directory: agent }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install @supabase/supabase-js --no-save --silent
      - name: Daily pitch run
        run: node scripts/run-daily.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}

  refresh:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.task == 'refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: { working-directory: agent }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install @supabase/supabase-js --no-save --silent
      - name: Hot refresh + revise pitches
        run: node scripts/refresh-and-revise.mjs --json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  metric-links:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'metric-links' || inputs.task == 'metric-links-apply')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: agent }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install @supabase/supabase-js --no-save --silent
      - name: Repair pitch metric links
        run: node scripts/fix-metric-links.mjs ${{ inputs.task == 'metric-links-apply' && '--apply' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  oecd:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'oecd'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: { working-directory: agent }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install @supabase/supabase-js --no-save --silent
      - name: OECD only
        run: node scripts/load-sources.mjs oecd
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  articles:
    # Daily auto-articles from all-5 pitches (web/scripts/auto-articles.ts).
    # 16:07 UTC (3am Sydney), after the daily taste run, so articles land by breakfast despite schedule delays.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'articles' || inputs.task == 'articles-dry-run' || inputs.task == 'articles-draft') ||
      github.event_name == 'schedule' && github.event.schedule == '7 16 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --silent
      - run: npm install @supabase/supabase-js --no-save --silent
        working-directory: agent
      - name: Ensure ffmpeg (hero video muxing)
        # Never block the articles: without ffmpeg, media is published unencoded and unnarrated.
        continue-on-error: true
        timeout-minutes: 4
        run: |
          # Static ffmpeg from npm (downloads from GitHub releases); apt on the runners is unreliable.
          npm install --no-save --silent ffmpeg-static@5.3.0
          echo "FFMPEG_PATH=$(node -p "require('ffmpeg-static')")" >> "$GITHUB_ENV"
      - name: Write and publish articles
        run: npx tsx --import ./scripts/node-shims.mjs scripts/auto-articles.ts ${{ inputs.task == 'articles-dry-run' && '--dry-run' || inputs.task == 'articles-draft' && '--no-publish' || '' }}
        env:
          AUTO_ARTICLE_PITCHES: ${{ inputs.pitch }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

  visuals:
    # Visual Capitalist-style graphics for The Indices: pick a dataset, write the words from its numbers, check every
    # number, publish under the daily cap. pitch input = a dataset key to force (e.g. rank:hsl_11_1).
    if: >-
      github.event_name == 'workflow_dispatch' && startsWith(inputs.task, 'visuals') ||
      github.event_name == 'schedule' && github.event.schedule == '19 21 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --silent
      - run: npm install @supabase/supabase-js --no-save --silent
        working-directory: agent
      - name: Generate visuals
        run: >-
          npx tsx --import ./scripts/node-shims.mjs scripts/generate-visuals.ts
          ${{ inputs.task == 'visuals-dry-run' && '--dry-run' || inputs.task == 'visuals-list' && '--list' || '' }}
        env:
          VISUAL_KEY: ${{ inputs.pitch }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  schedule:
    # The content scheduling assistant (web/scripts/schedule-content.ts): slot ready pieces within schedule_rules, then
    # bring connected social channels in step (YouTube uploads ahead of the slot with YouTube's own publish time).
    if: >-
      github.event_name == 'workflow_dispatch' && startsWith(inputs.task, 'schedule') ||
      github.event_name == 'schedule' && (github.event.schedule == '11 19 * * *' || github.event.schedule == '11 1 * * *' || github.event.schedule == '11 7 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --silent
      - name: Schedule content
        run: npx tsx --import ./scripts/node-shims.mjs scripts/schedule-content.ts ${{ inputs.task == 'schedule-list' && '--list' || inputs.task == 'schedule-reupload-youtube' && '--reupload=youtube' || '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

  races:
    # Bar-chart-race videos (9:16, 16:9, 1:1) with music and data-derived captions, published as a visual.
    # pitch input = a race key to force (e.g. race:erp_cob). races-dry-run uploads to drafts/ and publishes nothing.
    if: >-
      github.event_name == 'workflow_dispatch' && startsWith(inputs.task, 'races') ||
      github.event_name == 'schedule' && github.event.schedule == '43 22 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --silent
      - name: Render bar-chart races
        run: >-
          npx tsx --import ./scripts/node-shims.mjs scripts/render-races.ts
          ${{ inputs.task == 'races-dry-run' && '--dry-run' || inputs.task == 'races-list' && '--list' || '' }}
        env:
          VISUAL_KEY: ${{ inputs.pitch }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

  story-refresh:
    # Rewrite published articles in the house news style (web/scripts/refresh-stories.ts; pitch input = slugs).
    # story-refresh saves pending revisions to preview at /stories/<slug>?revision=1; story-refresh-apply puts
    # revisions that passed their checks live, archiving the replaced version.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'story-refresh' || inputs.task == 'story-refresh-apply' || startsWith(inputs.task, 'story-revision-')
        || inputs.task == 'story-sources' || inputs.task == 'story-drafts' || inputs.task == 'story-publish'
        || inputs.task == 'story-figures' || inputs.task == 'story-charts' || inputs.task == 'story-audit' || inputs.task == 'story-rename' || inputs.task == 'story-notes' || inputs.task == 'story-restore-notes' || inputs.task == 'dashboard-check')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --silent
      - run: npm install @supabase/supabase-js --no-save --silent
        working-directory: agent
      - name: Dashboard check (read-only)
        if: inputs.task == 'dashboard-check'
        run: npx tsx --import ./scripts/node-shims.mjs scripts/dashboard-check.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Refresh stories
        if: inputs.task != 'dashboard-check'
        run: >-
          npx tsx --import ./scripts/node-shims.mjs scripts/refresh-stories.ts
          ${{ inputs.task == 'story-refresh-apply' && '--apply' || inputs.task == 'story-revision-show' && '--show'
          || inputs.task == 'story-revision-edit' && '--edit' || inputs.task == 'story-revision-recheck' && '--recheck'
          || inputs.task == 'story-sources' && '--sources' || inputs.task == 'story-revision-discard' && '--discard' || inputs.task == 'story-drafts' && '--drafts' || inputs.task == 'story-publish' && '--publish' || inputs.task == 'story-figures' && '--figures' || inputs.task == 'story-charts' && '--charts' || inputs.task == 'story-audit' && '--audit' || inputs.task == 'story-rename' && '--rename' || inputs.task == 'story-notes' && '--notes' || inputs.task == 'story-restore-notes' && '--restore-notes' || '' }}
        env:
          STORY_SLUGS: ${{ inputs.pitch }}
          REVISION_EDITS: ${{ inputs.edits }}
          REVISION_NOTE: ${{ inputs.note }}
          REFRESH_BRIEF: ${{ inputs.brief }}
          REVISION_METRICS: ${{ inputs.metrics }}
          REVISION_DROP: ${{ inputs.drop }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  events:
    # The events store (web/scripts/events.ts): watch list, past decisions, and the watcher that records a
    # release, refreshes the articles that quote it and writes the breaking story for significant ones.
    if: >-
      github.event_name == 'workflow_dispatch' && startsWith(inputs.task, 'events-') ||
      github.event_name == 'schedule' && (github.event.schedule == '23 2 * * *' || github.event.schedule == '41 0-8 * * 1-5')
    runs-on: ubuntu-latest
    timeout-minutes: 170
    defaults:
      run: { working-directory: web }
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --silent
      - run: npm install @supabase/supabase-js --no-save --silent
        working-directory: agent
      - name: Load the latest data and documents
        # The watcher needs the new statement or release and its numbers before it can record the event.
        if: inputs.task == 'events-watch' || github.event.schedule == '41 0-8 * * 1-5'
        continue-on-error: true
        working-directory: agent
        run: |
          node scripts/load-sources.mjs abs
          node scripts/load-sources.mjs rba
          node scripts/load-documents.mjs --recent
      - name: Ensure ffmpeg (breaking-story clip)
        if: inputs.task == 'events-watch' || github.event.schedule == '41 0-8 * * 1-5'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          npm install --no-save --silent ffmpeg-static@5.3.0
          echo "FFMPEG_PATH=$(node -p "require('ffmpeg-static')")" >> "$GITHUB_ENV"
      - name: CPI components
        # Every item the CPI is measured against (36_cpi_components.sql). Loads only when the ABS has a newer CPI
        # than the store, so the watcher records a CPI release with its breakdown; events-cpi reloads the history.
        if: >-
          inputs.task == 'events-watch' || inputs.task == 'events-calendar' || inputs.task == 'events-cpi' ||
          github.event.schedule == '41 0-8 * * 1-5' || github.event.schedule == '23 2 * * *'
        continue-on-error: ${{ inputs.task != 'events-cpi' }}
        working-directory: agent
        run: node scripts/load-cpi-components.mjs ${{ inputs.task == 'events-cpi' && '--full' || '' }}
      - name: Events
        if: inputs.task != 'events-cpi'
        run: >-
          npx tsx --import ./scripts/node-shims.mjs scripts/events.ts
          ${{ (inputs.task == 'events-calendar' || github.event.schedule == '23 2 * * *') && '--calendar' || '' }}
          ${{ inputs.task == 'events-backfill' && '--backfill' || '' }}
          ${{ inputs.task == 'events-history' && '--history' || '' }}
          ${{ (inputs.task == 'events-watch' || github.event.schedule == '41 0-8 * * 1-5') && '--watch' || '' }}
          ${{ inputs.task == 'events-list' && '--list' || '' }}

  scout:
    # Daily source scout (agent/scripts/scout-sources.mjs): adopt official series that
    # research suggested or pitches keep asking for, load them, re-link pitches. 03:07 UTC.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'scout' || inputs.task == 'scout-dry-run') ||
      github.event_name == 'schedule' && github.event.schedule == '7 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run: { working-directory: agent }
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install @supabase/supabase-js --no-save --silent
      - name: Scout sources
        run: node scripts/scout-sources.mjs ${{ inputs.task == 'scout-dry-run' && '--dry-run' || '' }}
        env:
          SCOUT_IDS: ${{ inputs.pitch }}
      - name: Load adopted series
        if: inputs.task != 'scout-dry-run'
        run: |
          node scripts/load-sources.mjs abs
          node scripts/load-sources.mjs oecd
          node scripts/load-sources.mjs rba
          node scripts/load-sources.mjs extra
          node scripts/watch-wb.mjs load
      - name: Re-link pitches
        if: inputs.task != 'scout-dry-run'
        run: node scripts/fix-metric-links.mjs --apply

  media-smoke:
    # One small image and a voice line (optionally a 4s video) to confirm the ElevenLabs setup;
    # hero-media generates hero art and the narrated clip for one story (pitch input = slug).
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'media-smoke' || inputs.task == 'media-smoke-video' || inputs.task == 'hero-media' || inputs.task == 'hero-image' || inputs.task == 'hero-brief' || inputs.task == 'hero-review' || startsWith(inputs.task, 'story-highlights'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --silent
      - name: ElevenLabs smoke test
        if: inputs.task != 'hero-media' && inputs.task != 'hero-image' && inputs.task != 'hero-brief' && inputs.task != 'hero-review' && !startsWith(inputs.task, 'story-highlights')
        run: npx tsx --import ./scripts/node-shims.mjs scripts/elevenlabs-smoke.ts ${{ inputs.task == 'media-smoke-video' && '--video' || '' }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      - name: Ensure ffmpeg
        # Also for hero-image: ffmpeg re-encodes the 2K PNG for the web (without it the raw ~7 MB file is used).
        if: inputs.task == 'hero-media' || inputs.task == 'hero-image'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          # Static ffmpeg from npm (downloads from GitHub releases); apt on the runners is unreliable.
          npm install --no-save --silent ffmpeg-static@5.3.0
          echo "FFMPEG_PATH=$(node -p "require('ffmpeg-static')")" >> "$GITHUB_ENV"
      - name: Hero image (and, for hero-media, video) for one story (pitch input = story slug)
        if: inputs.task == 'hero-media' || inputs.task == 'hero-image'
        run: npx tsx --import ./scripts/node-shims.mjs scripts/hero-media.ts ${{ inputs.task == 'hero-media' && '--video' || '' }}
        env:
          HERO_SLUG: ${{ inputs.pitch }}
          HERO_BRIEF: ${{ inputs.edits }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: The story in three numbers (pitch = story slugs; empty = every published story)
        if: startsWith(inputs.task, 'story-highlights')
        run: npx tsx --import ./scripts/node-shims.mjs scripts/story-highlights.ts ${{ inputs.task == 'story-highlights-dry-run' && '--dry-run' || '' }}
        env:
          HIGHLIGHT_SLUGS: ${{ inputs.pitch }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Picture check on existing illustrations, no images made (pitch = story slugs; edits = image URLs to check against one story)
        if: inputs.task == 'hero-review'
        run: npx tsx --import ./scripts/node-shims.mjs scripts/hero-media.ts --review
        env:
          HERO_SLUG: ${{ inputs.pitch }}
          HERO_REVIEW_URLS: ${{ inputs.edits }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Art briefs only, no images (pitch input = story slugs; empty = the latest published stories)
        if: inputs.task == 'hero-brief'
        run: npx tsx --import ./scripts/node-shims.mjs scripts/hero-media.ts --brief
        env:
          HERO_SLUG: ${{ inputs.pitch }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  reel-cut:
    # Cuts one story's reel (pitch input = slug): Remotion renders the locked storyboard, charts and
    # burned-in text drawn from the traced figures, ElevenLabs reads each scene, and the MP4 is
    # recorded on story_reel_renders. The reel page's "Cut the reel" button dispatches this.
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'reel-cut'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --silent
      - name: Ensure ffmpeg
        # Measures each read so a scene can stretch to fit it; without ffmpeg scenes keep the storyboard's length.
        continue-on-error: true
        timeout-minutes: 4
        run: |
          npm install --no-save --silent ffmpeg-static@5.3.0
          echo "FFMPEG_PATH=$(node -p "require('ffmpeg-static')")" >> "$GITHUB_ENV"
      - name: Cut the reel for one story (pitch input = story slug)
        run: npx tsx --import ./scripts/node-shims.mjs scripts/reel-cut.ts
        env:
          REEL_SLUG: ${{ inputs.pitch }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  sources:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'sources' || inputs.task == 'both' || inputs.task == 'documents' || inputs.task == 'polls' || inputs.task == 'polls-dry-run' || inputs.task == 'population' || inputs.task == 'population-dry-run' || inputs.task == 'pnl' || inputs.task == 'pnl-dry-run' || inputs.task == 'wb') ||
      github.event_name == 'schedule' && github.event.schedule == '7 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run: { working-directory: agent }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install @supabase/supabase-js --no-save --silent
      - name: Source connectors (ABS + World Bank + RBA)
        if: inputs.task != 'documents' && !startsWith(inputs.task, 'polls') && !startsWith(inputs.task, 'population') && !startsWith(inputs.task, 'pnl') && inputs.task != 'wb'
        run: node scripts/load-sources.mjs all --revise
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Published polls (Wikipedia compilation, cited and checked rows only; tier-3 context)
        if: always() && inputs.task != 'documents' && !startsWith(inputs.task, 'population') && !startsWith(inputs.task, 'pnl') && inputs.task != 'wb'
        continue-on-error: ${{ inputs.task != 'polls' && inputs.task != 'polls-dry-run' }}
        timeout-minutes: 5
        run: node scripts/watch-polls.mjs ${{ inputs.task == 'polls-dry-run' && '--dry-run' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Population detail (ABS components of change, country of birth, visa groups, visitors)
        if: always() && inputs.task != 'documents' && !startsWith(inputs.task, 'polls') && !startsWith(inputs.task, 'pnl') && inputs.task != 'wb'
        continue-on-error: ${{ !startsWith(inputs.task, 'population') }}
        timeout-minutes: 10
        run: node scripts/load-population.mjs ${{ inputs.task == 'population-dry-run' && '--dry-run' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: National accounts as a profit and loss statement (ABS ANA_INC, ANA_AGG, ANA_EXP, BOP)
        if: always() && inputs.task != 'documents' && !startsWith(inputs.task, 'polls') && !startsWith(inputs.task, 'population') && inputs.task != 'wb'
        continue-on-error: ${{ !startsWith(inputs.task, 'pnl') }}
        timeout-minutes: 10
        run: node scripts/load-pnl.mjs ${{ inputs.task == 'pnl-dry-run' && '--dry-run' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: World Bank series only (pitch input = metric ids, space separated; empty = all)
        if: inputs.task == 'wb'
        run: node scripts/watch-wb.mjs load
        env:
          WB_METRICS: ${{ inputs.pitch }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Official documents as text (RBA statements, minutes, speeches; ABS release pages)
        # Feeds the source check; never blocks the data connectors.
        if: always() && !startsWith(inputs.task, 'polls') && !startsWith(inputs.task, 'population') && !startsWith(inputs.task, 'pnl') && inputs.task != 'wb'
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/load-documents.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
